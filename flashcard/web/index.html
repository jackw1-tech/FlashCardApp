<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ripasso delle flashcard del vault Obsidian.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flashcard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Flashcard</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script">

  <style>
    html, body { margin: 0; height: 100%; background: #faf9f5; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: Georgia, 'Times New Roman', serif; color: #141413;
      transition: opacity 200ms ease-out;
    }
    #splash .name { font-size: 40px; letter-spacing: -0.8px; }
    #splash .bar { width: 120px; height: 3px; border-radius: 3px; background: #e6dfd8; overflow: hidden; }
    #splash .bar::after {
      content: ''; display: block; width: 40%; height: 100%; background: #cc785c; border-radius: 3px;
      animation: splash-load 1.1s ease-in-out infinite;
    }
    @keyframes splash-load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-color-scheme: dark) {
      html, body { background: #181715; }
      #splash { color: #faf9f5; }
      #splash .bar { background: #3a3732; }
    }
  </style>

  <script>
    (function () {
      try {
        var api = localStorage.getItem('fc.api_base');
        var refreshExpires = Date.parse(localStorage.getItem('fc.refresh_expires_at') || '');
        if (!api || !(refreshExpires > Date.now())) return;

        var preconnect = document.createElement('link');
        preconnect.rel = 'preconnect';
        preconnect.href = api;
        preconnect.crossOrigin = 'use-credentials';
        document.head.appendChild(preconnect);

        function get(path) {
          return fetch(api + path, { credentials: 'include' }).then(function (response) {
            return response.text().then(function (body) {
              return { status: response.status, body: body };
            });
          });
        }

        var accessExpires = Date.parse(localStorage.getItem('fc.access_expires_at') || '');
        var accessValid = accessExpires - 60 * 1000 > Date.now();
        var prefetch = { session: get('/api/auth/session/') };
        if (accessValid) {
          prefetch.decks = get('/api/decks/');
          prefetch.stats = get('/api/stats/');
        }
        window.__fcPrefetch = prefetch;
      } catch (error) {
      }
    })();
  </script>
</head>
<body>
  <div id="splash" aria-hidden="true"><div class="name">Flashcard</div><div class="bar"></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 250);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
