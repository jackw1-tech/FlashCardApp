x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  build:
    context: ./backend
    args:
      REQUIREMENTS: requirements.txt
  image: flashcardapp-backend:prod
  env_file: .env
  restart: unless-stopped
  logging: *logging
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    build: ./db
    image: flashcardapp-db:prod
    command: postgres -c shared_buffers=64MB -c max_connections=20 -c work_mem=4MB -c max_slot_wal_keep_size=256MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRES_REPLICATION_SLOT: flashcard_replica
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-primary.sh:/docker-entrypoint-initdb.d/10-replica.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  db-replica:
    image: flashcardapp-db:prod
    user: postgres
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: db
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      POSTGRES_REPLICATION_SLOT: flashcard_replica
      REPLICA_APPLY_DELAY: ${REPLICA_APPLY_DELAY:-0}
    volumes:
      - pgreplica:/var/lib/postgresql/data
      - ./db/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 48mb --maxmemory-policy volatile-lru --appendonly yes --appendfsync everysec
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 64m
    restart: unless-stopped
    logging: *logging

  backend:
    <<: *backend
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi --worker-class gthread --workers 1 --threads 4 --timeout 1800 --bind 0.0.0.0:8000 --access-logfile -"
    environment:
      POSTGRES_HOST: db
      POSTGRES_REPLICA_HOSTS: db-replica
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "false"
      AUTH_COOKIE_SECURE: "true"
    volumes:
      - vaultrepo:/var/lib/vault
    networks:
      default:
      proxy:
        aliases:
          - flashcard-backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 192m

  mcp:
    <<: *backend
    command: python manage.py mcp_server --port 8001
    networks:
      default:
      proxy:
        aliases:
          - flashcard-mcp
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 160m

volumes:
  pgdata:
  pgreplica:
  redisdata:
  vaultrepo:

networks:
  default:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
